name: publish

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish a release even if the data did not change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 12moon-open/moonbase
          path: .moonbase
          persist-credentials: false
      - name: Prepare
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'jsonschema==4.26.0'
      - name: Test
        working-directory: .moonbase
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -t .'
      - name: Build
        working-directory: .moonbase
        env:
          CONTRIBUTIONS_API: ${{ vars.CONTRIBUTIONS_API }}
        run: |
          export_file=$("$RUNNER_TEMP/venv/bin/python" -m pipeline.fetch "$RUNNER_TEMP/source")
          # Measures are optional: without them, the build keeps the last known values.
          checks=()
          if checks_file=$("$RUNNER_TEMP/venv/bin/python" -m pipeline.fetch_checks "$RUNNER_TEMP/checks"); then
            checks=(--checks "$checks_file")
          else
            echo "::warning::Radio Browser checker measures unavailable, keeping the last known values"
          fi
          # Stations added by installations. Once the API is configured, a failure stops the
          # build: without them, every contributed station would be retired.
          contributions=()
          if [ -n "$CONTRIBUTIONS_API" ]; then
            "$RUNNER_TEMP/venv/bin/python" -m pipeline.fetch_contributions "$CONTRIBUTIONS_API" "$RUNNER_TEMP/contributions.json"
            contributions=(--contributions "$RUNNER_TEMP/contributions.json")
          fi
          "$RUNNER_TEMP/venv/bin/python" -m pipeline.build --input "$export_file" "${checks[@]}" "${contributions[@]}" --same-stations data/same-stations.json --out "$GITHUB_WORKSPACE" --dist "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/venv/bin/python" tools/validate_dataset.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dist"
      - name: Stage
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp -R v1 "$RUNNER_TEMP/out/data"
          cp -R "$RUNNER_TEMP/dist" "$RUNNER_TEMP/out/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataset
          path: ${{ runner.temp }}/out
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_RELEASE: ${{ inputs.force_release && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dataset
          path: ${{ runner.temp }}/in
      - name: Commit
        id: commit
        run: |
          git config user.name '12moon bot'
          git config user.email 'noreply@12moon.app'
          rm -rf v1
          cp -R "$RUNNER_TEMP/in/data" v1
          git add -A v1
          version=$(python3 -I -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/in/dist/v1/manifest.json'))['dataset_version'])")
          [[ "$version" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]{1,3}$ ]] || { echo "invalid version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit --quiet -m "Update dataset $version"
            git push --quiet origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release
        if: steps.commit.outputs.changed == 'true' || env.FORCE_RELEASE == 'true'
        env:
          VERSION: ${{ steps.commit.outputs.version }}
        run: |
          cd "$RUNNER_TEMP"
          tar -C in/dist -czf dist.tar.gz v1
          sha256sum dist.tar.gz > dist.tar.gz.sha256
          if gh release view "data-$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "data-$VERSION" dist.tar.gz dist.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "data-$VERSION" dist.tar.gz dist.tar.gz.sha256 --latest --title "Dataset $VERSION" --notes "CC0 1.0." --repo "$GITHUB_REPOSITORY"
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[30:][].tagName' | while read -r old; do
            gh release delete "$old" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          done
