name: wikidata

# Once a week, download the radio stations known to Wikidata (CC0) and keep them as the
# asset of the release "wikidata", which the daily build reads.

on:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wikidata
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 12moon-open/moonbase
          path: .moonbase
          persist-credentials: false
      - name: Fetch
        working-directory: .moonbase
        run: python3 -m pipeline.fetch_wikidata "$RUNNER_TEMP/wikidata.json.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wikidata
          path: ${{ runner.temp }}/wikidata.json.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wikidata
          path: in
      - name: Release
        run: |
          if gh release view wikidata --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload wikidata in/wikidata.json.gz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create wikidata in/wikidata.json.gz --latest=false --title "Wikidata radio stations" \
              --notes "Radio stations from Wikidata (CC0), refreshed every week. Read by the daily build." --repo "$GITHUB_REPOSITORY"
          fi
